<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 60px;
        }
        .container {
            background: white;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        img {
            width: 300px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .info {
            margin-top: 20px;
            text-align: left;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Predicted Character</h1>
        <img src="{{ image_name }}" alt="Prediction Image">
        <div class="info">
            <p><strong>📁 Folder:</strong> {{ folder }}</p>
            <p><strong>🔤 Kannada Character:</strong> {{ character }}</p>
            <p><strong>📊 Confidence:</strong> {{ confidence }}</p>
        </div>
        <br>
        <a href="/" style="text-decoration:none; color:white; background-color:#3498db; padding:10px 20px; border-radius:8px;">🔙 Go Back</a>
    </div>
</body>
</html>
